<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--ink-2:#555;--ink-3:#8a8a8a;--line:#ccc;--line-2:#e8e8e8;--accent:#E93F97;
 --cat-shoot:#E93F97;--cat-shoot-bg:#FCEAF3;
 --cat-class:#B8863B;--cat-class-bg:#F4EEE3;
 --cat-client:#4A6FA5;--cat-client-bg:#E6EBF2;
 --cat-lev:#6B3FA0;--cat-lev-bg:#EFE7F5;
 --travel-bg:#FBEAF3;--row-h:26px}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:300 14px/1.5 Ubuntu,-apple-system,Segoe UI,sans-serif}
header{border-bottom:1px solid var(--ink);padding:16px 22px;display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}
.brand{font-size:15px;letter-spacing:2px;text-transform:uppercase}
.brand span{display:block;font-size:9px;letter-spacing:1.5px;color:var(--ink-3);margin-top:3px}
.studio{font-size:11px;color:var(--ink-3);letter-spacing:.3px}
.studio a{color:var(--ink-3)}
.role{margin-left:auto;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--line);padding:5px 10px}
.role.agent{border-color:var(--accent);color:var(--accent)}
.saved{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
main{max-width:1600px;margin:0 auto;padding:22px}
h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 12px;color:var(--ink-2)}
.layout{display:flex;gap:22px;align-items:flex-start}
.side{width:300px;flex:none}
.roster{border:1px solid var(--line-2);max-height:560px;overflow:auto}
.roster-row{padding:8px 10px;border-bottom:1px solid var(--line-2);cursor:pointer}
.roster-row .top{display:flex;gap:8px;align-items:center}
.roster-row:hover{background:#fafafa}
.roster-row.travel{background:var(--travel-bg)}
.roster-row.active .top{outline:2px solid var(--accent);outline-offset:-2px}
.roster-expand{margin-left:auto;flex:none;padding:4px 8px;font-size:14px;color:var(--ink-3);cursor:pointer;line-height:1}
.roster-expand:hover{color:var(--accent)}
.roster-ph{width:30px;height:42px;flex:none;background:#f4f4f4;overflow:hidden;border:1px solid var(--line-2)}
.roster-ph img{width:100%;height:100%;object-fit:cover;display:block}
.roster-ph.logo{width:46px;height:32px;background:#fff}
.roster-ph.logo img{object-fit:contain;padding:2px}
.roster-name{font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.roster-status{font-size:9px;color:var(--ink-3);letter-spacing:.5px}
.roster-fields{display:none;padding:8px 2px 4px}
.roster-row.open .roster-fields{display:block}
.roster-fields input[type=text]{width:100%;border:none;border-bottom:1px solid var(--line);font:300 11px Ubuntu;padding:4px 0;margin:2px 0 8px;background:none}
.roster-fields textarea{width:100%;border:1px solid var(--line);font:300 11px Ubuntu;padding:6px;margin:2px 0 8px;resize:vertical}
.roster-fields label{font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;display:block}
.roster-fields select{font:300 11px Ubuntu;border:1px solid var(--line);padding:3px;margin:2px 0 8px;width:100%}
.roster-fields .chk{display:flex;align-items:center;gap:6px;margin:2px 0 8px;font-size:11px}
.roster-fields .mini{font-size:9px;color:var(--ink-3);text-transform:uppercase;cursor:pointer;text-decoration:underline}
.roster-fields input[type=time]{width:100%;border:none;border-bottom:1px solid var(--line);font:300 11px Ubuntu;padding:4px 0;margin:2px 0 8px;background:none}
.roster-fields .tt-row{display:flex;gap:10px}
.roster-fields .tt-row>div{flex:1;min-width:0}
.roster-fields .ticket-row{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.roster-fields .file-btn{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);cursor:pointer;text-decoration:underline}
.roster-fields .file-btn input[type=file]{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0}
.roster-fields .ticket-row a{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3)}
.roster-fields .paste-hint{font-size:9px;color:var(--ink-3)}
.side .btn{width:100%;margin-top:10px}
.cal-wrap{flex:1;min-width:0;overflow-x:auto}
.cal{display:grid;grid-template-columns:56px repeat(4,1fr);min-width:780px}
.cal-corner{border-bottom:1px solid var(--ink)}
.cal-daylabel{border-bottom:1px solid var(--ink);border-left:1px solid var(--line-2);padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.daylabel-lev{display:block;font-size:9px;letter-spacing:.5px;color:var(--cat-shoot);margin-top:2px;text-transform:none}
.cal-gutter{position:relative;height:calc(var(--row-h)*28)}
.cal-gutter i{position:absolute;left:0;right:4px;top:0;transform:translateY(-50%);font-style:normal;font-size:9px;color:var(--ink-3);text-align:right}
.daycol{position:relative;height:calc(var(--row-h)*28);border-left:1px solid var(--line-2);
  background-image:repeating-linear-gradient(to bottom, var(--line-2), var(--line-2) 1px, transparent 1px, transparent var(--row-h));cursor:copy}
.daycol .off{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f2f2f2 6px,#f2f2f2 12px);pointer-events:none;border-bottom:1px dashed var(--line)}
.daycol .levwin{position:absolute;left:0;right:0;border-top:1px dashed var(--cat-shoot);border-bottom:1px dashed var(--cat-shoot);pointer-events:none;z-index:5;opacity:.6}
.slot{position:absolute;border-left:3px solid;border-radius:2px;padding:3px 6px;overflow:hidden;font-size:10px;cursor:pointer;box-sizing:border-box}
.slot.cat-shoot{background:var(--cat-shoot-bg);border-color:var(--cat-shoot)}
.slot.lev{background:var(--cat-lev-bg);border-color:var(--cat-lev)}
.slot.cat-class{background:var(--cat-class-bg);border-color:var(--cat-class)}
.slot.cat-client{background:var(--cat-client-bg);border-color:var(--cat-client)}
.slot .t{font-size:9px;color:var(--ink-3);letter-spacing:.5px}
.slot .ti{font-size:11px;text-transform:uppercase;letter-spacing:.3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .avatars{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.slot .av{display:flex;flex-direction:column;align-items:center;width:34px}
.slot .av img,.slot .av .initial{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#eee;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.08)}
.slot .av span{font-size:8px;text-align:center;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36px}
.slot.dim{opacity:.22}
.slot.mine{outline:2px solid var(--ink);outline-offset:-2px}
.slot.secondary{box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:9px}
.slot.secondary .ti{font-size:8px;text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.slot.secondary .t{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}
.slot.secondary .av{width:22px}
.slot.secondary .av img,.slot.secondary .av .initial{width:18px;height:18px;font-size:8px}
.slot.secondary .av span{max-width:24px;font-size:7px}
.slot-marker{position:absolute;left:0;right:0;border-top:1px dashed rgba(0,0,0,.45);pointer-events:none;z-index:3}
.slot-marker.has-range{border-bottom:1px dashed rgba(0,0,0,.3);background:rgba(0,0,0,.04)}
.slot-marker-time{position:absolute;top:-7px;left:2px;font-size:7px;line-height:1;background:rgba(255,255,255,.9);padding:0 2px;color:var(--ink-2);white-space:nowrap}
.slot-marker-avatars{position:absolute;top:2px;left:2px;display:flex;gap:3px;flex-wrap:wrap}
.slot-marker-avatars .av{width:24px;flex:none;display:flex;flex-direction:column;align-items:center}
.slot-marker-avatars .av img,.slot-marker-avatars .av .initial{width:20px;height:20px;border-radius:50%;object-fit:cover;background:#eee;font-size:9px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.15)}
.slot-marker-avatars .av span{font-size:7px;text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26px;margin-top:1px}
/* Узкие вторичные блоки: пунктирные метки показывают только фото — подписи
   времени/имени там не помещаются. При наведении на весь блок он визуально
   "раскрывается" (поднимается над соседями, чуть увеличивается) и подписи
   появляются — видно, кто и во сколько снимается, не открывая карточку. */
.slot-marker.compact .slot-marker-time,
.slot-marker.compact .slot-marker-avatars .av span{display:none}
.slot.secondary{transition:width .12s ease,box-shadow .12s ease}
/* ширину меняем по-настоящему (не transform:scale — он только рисует крупнее
   то же самое, а обрезанный по ellipsis текст обратно не появляется), чтобы
   "Визажист", "Марго" и подписи моделей реально помещались целиком */
.slot.secondary:hover{z-index:50;width:150px!important;box-shadow:0 6px 18px rgba(0,0,0,.28);background:#fff}
.slot.secondary:hover .t,.slot.secondary:hover .ti{font-size:11px}
.slot.secondary:hover .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.3px}
.slot.secondary:hover .slot-marker.compact .slot-marker-time,
.slot.secondary:hover .slot-marker.compact .slot-marker-avatars .av span{display:block}
.ptimes{margin:2px 0 8px}
.ptime-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;padding:3px 0;border-bottom:1px solid var(--line-2)}
.ptime-row input[type=time]{border:1px solid var(--line);padding:3px 4px;font:300 11px Ubuntu}
.ptime-range{display:flex;align-items:center;gap:4px;flex:none}
.ptime-sep{color:var(--ink-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin:14px 0 0}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-left:3px solid}
.filterbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.travel-summary{border:1px solid var(--line-2);margin:22px 0}
.travel-summary h2{margin:0;padding:10px 12px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
.ts-count{background:var(--accent);color:#fff;font-size:9px;letter-spacing:0;padding:1px 6px;border-radius:8px}
.ts-scroll{overflow-x:auto}
.ts-table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
.ts-table th{text-align:left;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);padding:6px 12px;border-bottom:1px solid var(--line-2)}
.ts-table td{padding:7px 12px;border-bottom:1px solid var(--line-2)}
.ts-table tr:last-child td{border-bottom:none}
.ts-table tr{cursor:pointer}
.ts-table tr:hover td{background:#fafafa}
.ts-model{display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.3px;font-size:11px}
.ts-av{width:26px;height:26px;flex:none;border-radius:50%;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center;font-size:10px;text-transform:uppercase;border:1px solid rgba(0,0,0,.08)}
.ts-av img{width:100%;height:100%;object-fit:cover;display:block}
.ts-empty{color:var(--ink-3)}
.ts-ticket{font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--accent);text-decoration:underline;margin-left:4px;white-space:nowrap}
select,.btn{font:400 11px Ubuntu,sans-serif;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line);background:#fff;padding:7px 12px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{color:#fff;border-color:var(--accent);background:var(--accent)}
.checklists{display:flex;gap:22px;margin-top:36px;flex-wrap:wrap}
.checklist{flex:1;min-width:280px;border:1px solid var(--line-2);padding:14px 16px}
.checklist.wide{flex-basis:100%;width:100%}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 28px}
.chk-item{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.chk-item input[type=checkbox]{margin-top:2px}
.chk-item .txt{flex:1}
.chk-item .txt[contenteditable=true]{outline:none;border-bottom:1px dashed transparent}
.chk-item .txt[contenteditable=true]:focus{border-bottom-color:var(--accent)}
.chk-item .del{color:var(--ink-3);cursor:pointer;font-size:14px;line-height:1}
.chk-add{display:flex;gap:8px;margin-top:10px}
.chk-add input{flex:1;border:none;border-bottom:1px solid var(--line);font:300 12px Ubuntu;padding:5px 0}
.readonly-note{font-size:10px;color:var(--ink-3);letter-spacing:.3px;margin-top:8px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50}
.hoverpop{position:fixed;z-index:70;background:#fff;border:1px solid var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.15);padding:12px 14px;width:220px;font-size:12px}
.hoverpop .hp-name{font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.hoverpop label{display:block;font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;margin-top:8px}
.hoverpop input[type=text]{width:100%;border:none;border-bottom:1px solid var(--line);font:300 12px Ubuntu;padding:4px 0;margin-top:2px;background:none}
.hoverpop select{width:100%;border:1px solid var(--line);padding:4px;margin-top:2px;font:300 12px Ubuntu}
.hoverpop .hp-chk{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px}
.hoverpop .hp-save{width:100%;margin-top:10px}
.modal{background:#fff;padding:24px;width:380px;max-width:92vw;max-height:88vh;overflow:auto}
.modal h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;margin:0 0 14px}
.modal label{display:block;font-size:9px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;margin-top:10px}
.modal select,.modal input,.modal textarea{width:100%;border:1px solid var(--line);padding:6px 8px;font:300 13px Ubuntu;margin-top:3px}
.modal .row{display:flex;gap:10px}
.modal .row>*{flex:1}
.modal .pill{display:inline-block;border:1px solid var(--line);padding:3px 8px;margin:3px 4px 0 0;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.modal .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal .multi{margin-top:4px}
.modal .actions{display:flex;justify-content:space-between;margin-top:18px}
.loading{color:var(--ink-3);font-size:12px;letter-spacing:.5px;text-transform:uppercase}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:8px 16px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
#updateBar{position:sticky;top:0;left:0;right:0;z-index:60;display:none;align-items:center;justify-content:center;gap:14px;
  background:var(--accent);color:#fff;padding:9px 16px;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
#updateBar button{background:#fff;color:var(--accent);border:none;padding:5px 12px;font:400 10px Ubuntu,sans-serif;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.scrollhint{display:none;font-size:10px;color:var(--ink-3);letter-spacing:.8px;text-transform:uppercase;margin:0 0 8px}
/* Планшет/телефон: колонки в столбик, крупнее области нажатия, подсказка про скролл календаря. */
@media (max-width:900px){
  .layout{flex-direction:column}
  .side{width:100%}
  .roster{max-height:320px}
}
@media (max-width:640px){
  main{padding:16px 14px 60px}
  header{padding:12px 14px;gap:10px}
  .brand{font-size:13px}
  .studio{font-size:10px}
  .role{margin-left:0}
  .saved{display:none}
  h2{font-size:11px}
  .scrollhint{display:block}
  .cal{min-width:640px}
  .checklists{gap:16px;margin-top:26px}
  .checklist{padding:14px}
  .chk-grid{grid-template-columns:1fr}
  .chk-item{padding:11px 0}
  .chk-item input[type=checkbox]{width:18px;height:18px;flex:none}
  .filterbar select,.filterbar .btn{width:100%}
  .modal{width:94vw;padding:18px}
}
</style></head>
<body>
<div id="updateBar">Кто-то обновил данные <button id="updateBarBtn">Обновить</button></div>
<header id="head"></header>
<main id="app"><div class="loading">Загрузка…</div></main>
<div id="modalRoot"></div>
<div id="hoverPopRoot"></div>
<div id="toast"></div>
<script>
var TOKEN = (new URLSearchParams(location.search)).get('k') || '';
var EXEC_URL = "https://script.google.com/macros/s/AKfycbyqhXftx2kzemhL14VpCHuGAVpPo4x_47q0kvO1tKBfwSUZGKzpultg8H4vqcCFH4JyWA/exec";
var STATE = null;
var FILTER = null;
var KNOWN_REV = null;
var POLL_STARTED = false;
var POLL_MS = 20000;

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg || 'Сохранено';
  t.className = 'show';
  clearTimeout(toast._h);
  toast._h = setTimeout(function(){ t.className = ''; }, 1600);
}

/* Обмен со скриптом идёт обычным fetch() на его же /exec-адрес, а не через
   google.script.run — эта внутренняя RPC-прослойка Apps Script у некоторых
   пользователей ломается корпоративными расширениями безопасности в браузере
   (перехватывают её "protected function" механизм). Обычный сетевой запрос
   этой проблемы не имеет. Content-Type держим text/plain — иначе браузер
   перед POST шлёт CORS preflight (OPTIONS), а Apps Script на него не отвечает. */
function apiCall(action){
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(EXEC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, args: args })
  }).then(function(r){ return r.json(); }).then(function(res){
    if (res && res.error) { toast(res.error); throw res.error; }
    return res;
  });
}
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return apiCall.apply(null, [fn].concat(args)).catch(function(err){
    toast('Ошибка: ' + err);
    throw err;
  });
}

function load(){
  var done = false;
  var timeoutId = setTimeout(function(){
    if (done) return;
    document.getElementById('app').innerHTML = '<div class="loading">Сервер не ответил за 10 секунд. ' +
      'Обнови вкладку целиком (F5) — если не поможет, проверь Журнал выполнения в редакторе скрипта.</div>';
  }, 10000);
  apiCall('getState', TOKEN).then(function(state){
    done = true; clearTimeout(timeoutId);
    if (!state) {
      document.getElementById('app').innerHTML = '<div class="loading">Сервер отработал, но браузер получил пустой ответ. ' +
        'Похоже, расширение/антивирус в браузере мешает странице общаться со скриптом.</div>';
      return;
    }
    if (state.error) {
      document.getElementById('app').innerHTML = '<div class="loading">' + esc(state.error) + '</div>';
      return;
    }
    STATE = state;
    STATE.participants.sort(function(a, b){ return a.name.localeCompare(b.name, 'ru'); });
    STATE.images = STATE.images || {};
    KNOWN_REV = state.rev;
    hideUpdateBar();
    // Сперва рисуем ростер/календарь без фото — это быстро (только getState).
    // Фото подтягиваются отдельным запросом и подставляются вторым проходом,
    // не задерживая всё остальное на медленных сетях.
    render();
    startPolling();
    var ids = [];
    STATE.participants.forEach(function(p){
      if (p.photo_id) ids.push(p.photo_id);
      if (p.arrival_ticket_id) ids.push(p.arrival_ticket_id);
      if (p.departure_ticket_id) ids.push(p.departure_ticket_id);
    });
    STATE.clients.forEach(function(c){ if (c.logo_id) ids.push(c.logo_id); });
    if (ids.length) {
      apiCall('getImages', ids).then(function(images){
        STATE.images = images || {};
        render();
      }).catch(function(){ /* фото не критичны — молча пропускаем */ });
    }
  }).catch(function(err){
    done = true; clearTimeout(timeoutId);
    document.getElementById('app').innerHTML = '<div class="loading">Ошибка загрузки: ' + esc(String(err)) + '</div>';
  });
}

/* Раз в POLL_MS проверяем лёгкий счётчик изменений — если кто-то сохранил
   что-то с другой ссылки (или в другой вкладке), страница обновляется сама.
   Придерживаем автообновление, только если прямо сейчас открыто модальное
   окно слота или что-то активно набирается (фокус в поле ввода) — чтобы не
   стереть недописанное; в этом случае просто попробуем на следующем цикле. */
function busyEditing(){
  if (document.getElementById('modalRoot').children.length) return true;
  var el = document.activeElement;
  return !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable));
}

function startPolling(){
  if (POLL_STARTED) return;
  POLL_STARTED = true;
  setInterval(function(){
    apiCall('getRev').then(function(rev){
      if (rev === KNOWN_REV) return;
      if (busyEditing()) { showUpdateBar(); return; }
      hideUpdateBar();
      toast('Кто-то обновил данные на другом устройстве — подтягиваю');
      load();
    }).catch(function(){ /* тихо пропускаем — не критично */ });
  }, POLL_MS);
}

function showUpdateBar(){
  document.getElementById('updateBar').style.display = 'flex';
}
function hideUpdateBar(){
  document.getElementById('updateBar').style.display = 'none';
}
document.getElementById('updateBarBtn').onclick = function(){ hideUpdateBar(); load(); };

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function byId(list, id){ for (var i=0;i<list.length;i++) if (list[i].id === id) return list[i]; return null; }
function photoSrc(fileId){ return (fileId && STATE.images && STATE.images[fileId]) || ''; }

    '<div class="studio">' + esc(STATE.studio.name) + ' — ' + esc(STATE.studio.address) +

/* ---------- расписание: общая отрисовка ---------- */

function toMin(hhmm){ var p = String(hhmm||'00:00').split(':'); return (+p[0])*60 + (+p[1]); }
function topPx(hhmm){ return (toMin(hhmm) - toMin(STATE.gridStart)) / 30 * 26; }

// participant_times[pid] — время конкретной участницы внутри общего блока
// (съёмка/класс/клиент), формат {start,end}. Старые записи могли быть просто
// строкой "11:00" (без конца) — оборачиваем их сюда же, чтобы не мигрировать
// данные отдельно.
function normPT_(pt){
  if (!pt) return null;
  if (typeof pt === 'string') return { start: pt, end: '' };
  return pt.start ? pt : null;
}
function snapTime(px){
  var slot = Math.round(px / 26);
  var mins = toMin(STATE.gridStart) + slot * 30;
  var hh = Math.floor(mins/60), mm = mins%60;
  return (hh<10?'0':'')+hh + ':' + (mm<10?'0':'')+mm;
}

/* Слоты, пересекающиеся по времени, разводим по колонкам (как в обычном
   календаре), чтобы не наезжали друг на друга — вместо простого списка
   считаем для каждого слота его колонку и число колонок в его "грозди"
   пересечений. Слоты без пересечений всегда получают col:0, cols:1, то
   есть занимают всю ширину дня, как раньше. */
function layoutDaySlots(daySlots){
  var events = daySlots.map(function(s){
    return { s: s, start: toMin(s.start), end: Math.max(toMin(s.end), toMin(s.start) + 1) };
  }).sort(function(a,b){ return a.start - b.start || a.end - b.end; });

  var clusters = [], active = [], current = null;
  events.forEach(function(e){
    active = active.filter(function(a){ return a.end > e.start; });
    if (!active.length) { current = { events: [] }; clusters.push(current); }
    var used = active.map(function(a){ return a.col; });
    var col = 0;
    while (used.indexOf(col) >= 0) col++;
    e.col = col;
    current.events.push(e);
    active.push(e);
  });
  clusters.forEach(function(cl){
    var maxCol = 0;
    cl.events.forEach(function(e){ maxCol = Math.max(maxCol, e.col); });
    cl.events.forEach(function(e){ e.cols = maxCol + 1; });
  });
  return events;
}

function catLabel(s){
  if (s.category === 'shoot') return (s.subtype || 'Съёмка') + (s.title ? ' — ' + s.title : '');
  if (s.category === 'class') return s.subtype || 'Мастер-класс';
  if (s.category === 'client') { var c = byId(STATE.clients, s.client_id); return c ? c.name : 'Клиент'; }
  return s.title || '';
}

// короткая подпись для узкой (вторичной) полосы — там нет места на полное
// "Визажист — Имя", важнее имя специалиста/клиента, чем категория
function catLabelShort(s){
  if (s.category === 'shoot') return s.title || s.subtype || 'Съёмка';
  return catLabel(s);
}

// ids — необязательный список конкретных участниц (когда часть уже показана
// на пунктирных метках по времени, здесь остаются только те, у кого время не
// выставлено). Без ids — берём всех, как раньше.
function slotAvatarsHtml(s, ids){
  var out = '';
  if (s.category === 'client') {
    var c = byId(STATE.clients, s.client_id);
    if (c) { var cSrc = photoSrc(c.logo_id); out += '<div class="av">' + (cSrc ? '<img src="'+esc(cSrc)+'">' : '<div class="initial">'+esc(c.name[0])+'</div>') + '<span>'+esc(c.name)+'</span></div>'; }
  }
  (ids || s.participant_ids || []).forEach(function(pid){
    var p = byId(STATE.participants, pid);
    if (!p) return;
    var pSrc = photoSrc(p.photo_id);
    out += '<div class="av">' + (pSrc ? '<img src="'+esc(pSrc)+'">' : '<div class="initial">'+esc(p.name[0])+'</div>') + '<span>'+esc(p.name.split(' ')[0])+'</span></div>';
  });
  return out ? '<div class="avatars">'+out+'</div>' : '';
}

function buildCalendar(editable){
  var hours = [];
  for (var m = toMin(STATE.gridStart); m <= toMin(STATE.gridEnd); m += 60) {
    var hh = Math.floor(m/60);
    hours.push({ top: (m - toMin(STATE.gridStart))/30*26, label: (hh<10?'0':'')+hh + ':00' });
  }
  var gutter = '<div class="cal-gutter">' + hours.map(function(h){
    return '<i style="top:'+h.top+'px">'+h.label+'</i>';
  }).join('') + '</div>';

  var head = '<div class="cal-corner"></div>' + STATE.days.map(function(d){
    return '<div class="cal-daylabel">' + esc(d.label) + '</div>';
  }).join('');

  var cols = STATE.days.map(function(d){
    var daySlots = STATE.slots.filter(function(s){ return s.day === d.key; });
    if (!editable) {
      // модели не видят клиентов вообще, а слоты фотографа/визажиста/парикмахера/
      // стилиста — только если её саму в них добавил агент
      daySlots = daySlots.filter(function(s){
        if (s.category === 'client') return false;
        if (s.category === 'shoot') return !!FILTER && (s.participant_ids||[]).indexOf(FILTER) >= 0;
        return true;
      });
    }
    var off = '';
    if (d.dayStart && toMin(d.dayStart) > toMin(STATE.gridStart)) {
      off = '<div class="off" style="height:' + topPx(d.dayStart) + 'px"></div>';
    }
    // Приоритет по уровням: Лев — всегда на всю ширину дня (весь кэмп
    // строится вокруг него). Остальная съёмка (второй фотограф/визажист/
    // парикмахер/стилист) — на всю ширину, если не пересекается со Львом,
    // иначе узкой полоской поверх. Классы/клиенты — так же, но ещё и с
    // оглядкой на всю съёмку целиком (Лев + остальные).
    var isLev = function(s){ return s.category === 'shoot' && s.subtype === STATE.shootSubtypes[0]; };
    var levSlots = daySlots.filter(isLev);
    var restSlots = daySlots.filter(function(s){ return !isLev(s); }); // визажист/класс/клиент — все вместе
    var rangeOf = function(s){ return [toMin(s.start), toMin(s.end)]; };
    var overlapsAny = function(ranges, aStart, aEnd){
      return ranges.some(function(r){ return aStart < r[1] && r[0] < aEnd; });
    };

    function renderBlock(s, col, cols, secondary){
      var top = topPx(s.start), h = Math.max(20, topPx(s.end) - topPx(s.start));
      var colW = 100 / cols, wPct = colW, lPct = col * colW;
      if (secondary) {
        // Все второстепенные слоты (пересекающиеся со Львом) вместе делят ОДНУ
        // общую узкую полосу с правого края дня, а не сжимаются каждый
        // относительно своей же колонки — иначе получается россыпь с разрывами.
        var zone = 36;
        wPct = zone / cols;
        lPct = (100 - zone) + col * wPct;
      }
      var cls = 'slot cat-' + s.category + (isLev(s) ? ' lev' : '') + (secondary ? ' secondary' : '');
      if (FILTER) {
        var mine = (s.participant_ids||[]).indexOf(FILTER) >= 0;
        cls += mine ? ' mine' : ' dim';
      }
      var style = 'top:' + top + 'px;height:' + h + 'px;' +
        'left:calc(' + lPct + '% + 3px);width:calc(' + wPct + '% - 6px)';
      var baseLabel = catLabel(s) + (s.shoot_kind ? ' · ' + s.shoot_kind : '');
      // Пунктирная шкала времени: фото стоит на своей линии времени всегда
      // (видно сразу, не только при наведении). В узких вторичных блоках
      // (рядом со Львом) для подписи имени/времени физически нет места — там
      // просто фото (класс .compact), а полная подпись и сам блок покрупнее
      // раскрываются при наведении мышью (см. CSS ".slot:hover").
      var markers = '', timedIds = [];
      var tooltipTimes = '';
      if (s.participant_times) {
        var byRange = {};
        (s.participant_ids||[]).forEach(function(pid){
          var pt = normPT_(s.participant_times[pid]);
          if (!pt) return;
          timedIds.push(pid);
          var key = pt.start + '|' + (pt.end || '');
          (byRange[key] = byRange[key] || { start: pt.start, end: pt.end, ids: [] }).ids.push(pid);
        });
        var keys = Object.keys(byRange).sort();
        var rangeLabel = function(r){ return r.end ? (r.start + '–' + r.end) : r.start; };
        tooltipTimes = keys.map(function(key){
          var r = byRange[key];
          return rangeLabel(r) + ' ' + r.ids.map(function(pid){ var pp = byId(STATE.participants, pid); return pp ? pp.name : ''; }).join(', ');
        }).join('; ');
        // Отступ под заголовок блока (при наведении шрифт узких блоков
        // увеличивается до размера обычных — см. CSS ".slot.secondary:hover
        // .ti", поэтому запас одинаковый везде). Измерено реальным рендером:
        // время+название+паддинг вместе занимают около 34px.
        var headroom = 36;
        // Минимальная дистанция между соседними метками, чтобы фото+подпись
        // не наезжали друг на друга, если модели по времени стоят близко
        // (например, 14:45 и 15:30 — разница меньше высоты одной аватарки).
        var MIN_GAP = 34;
        var lastBottom = -Infinity;
        markers = keys.map(function(key){
          var r = byRange[key];
          var relTop = topPx(r.start) - top;
          if (relTop < -1 || relTop > h + 1) return '';
          // время может совпасть точно с началом блока (модель снимается с
          // самого открытия) — такую метку раньше отбрасывали как "слишком
          // близко к краю", и модель пропадала с календаря вообще. Не
          // отбрасываем, просто визуально сдвигаем ниже строки-заголовка и/
          // или предыдущей метки, чтобы ничего не наезжало друг на друга.
          var visualTop = Math.max(relTop, headroom, lastBottom);
          lastBottom = visualTop + MIN_GAP;
          var bandH = r.end ? Math.max(0, topPx(r.end) - topPx(r.start)) : 0;
          var avs = r.ids.map(function(pid){
            var pp = byId(STATE.participants, pid);
            if (!pp) return '';
            var pSrc = photoSrc(pp.photo_id);
            return '<div class="av">' + (pSrc ? '<img src="'+esc(pSrc)+'">' : '<div class="initial">'+esc(pp.name[0])+'</div>') + '<span>'+esc(pp.name.split(' ')[0])+'</span></div>';
          }).join('');
          var bandStyle = bandH > 0 ? ';height:' + bandH + 'px' : '';
          // сама пунктирная линия — на реальном времени (relTop), а вот
          // фото и подпись при необходимости сдвигаем вниз (offset), чтобы
          // не наезжать на заголовок блока или предыдущую метку
          var offset = visualTop - relTop;
          var timeStyle = offset > 0 ? ' style="top:' + (-7 + offset) + 'px"' : '';
          var avStyle = offset > 0 ? ' style="top:' + (2 + offset) + 'px"' : '';
          return '<div class="slot-marker' + (bandH>0?' has-range':'') + (secondary?' compact':'') + '" style="top:' + relTop + 'px' + bandStyle + '">' +
            '<span class="slot-marker-time"' + timeStyle + '>' + esc(rangeLabel(r)) + '</span>' +
            '<div class="slot-marker-avatars"' + avStyle + '>' + avs + '</div>' +
          '</div>';
        }).join('');
      }
      // Модели без выставленного времени — обычной строкой аватарок сверху.
      var untimedIds = (s.participant_ids||[]).filter(function(pid){ return timedIds.indexOf(pid) < 0; });
      var tooltipLabel = baseLabel + (tooltipTimes ? ' — ' + tooltipTimes : '');
      var shownLabel = secondary ? catLabelShort(s) : baseLabel;
      // Родной тултип браузера (title) нужен только широким блокам — у узких
      // при наведении и так раскрывается сам блок с подписями, а два всплытия
      // сразу (родной тултип + наш раскрытый блок) только мешают друг другу.
      var titleAttr = secondary ? '' : ' title="' + esc(s.start + '–' + s.end + ' ' + tooltipLabel) + '"';
      return '<div class="' + cls + '" data-slot="' + s.id + '" style="' + style + '"' + titleAttr + '>' +
        markers +
        '<div class="t">' + s.start + '–' + s.end + '</div>' +
        '<div class="ti">' + esc(shownLabel) + '</div>' +
        slotAvatarsHtml(s, untimedIds) +
        '</div>';
    }

    var levRanges = levSlots.map(rangeOf);

    // Визажист/класс/клиент делят место МЕЖДУ СОБОЙ поровну, бок о бок, без
    // наложения друг на друга — и только все вместе подстраиваются (сжимаются
    // узкой полоской) под Льва, если совпадают с ним по времени.
    var blocks =
      layoutDaySlots(levSlots).map(function(e){ return renderBlock(e.s, e.col, e.cols, false); }).join('') +
      layoutDaySlots(restSlots).map(function(e){
        return renderBlock(e.s, e.col, e.cols, overlapsAny(levRanges, e.start, e.end));
      }).join('');
    var clickable = editable ? ' data-day="' + d.key + '"' : '';
    return '<div class="daycol"' + clickable + '>' + off + blocks + '</div>';
  }).join('');

  var legend = editable
    ? '<span><i style="border-color:var(--cat-lev)"></i>Лев Ефимов</span>' +
      '<span><i style="border-color:var(--cat-shoot)"></i>Визажист / парикмахер / стилист / второй фотограф</span>' +
      '<span><i style="border-color:var(--cat-class)"></i>Мастер-классы</span>' +
      '<span><i style="border-color:var(--cat-client)"></i>Клиенты</span>'
    : '<span><i style="border-color:var(--cat-lev)"></i>Лев Ефимов</span>' +
      '<span><i style="border-color:var(--cat-shoot)"></i>Визажист / парикмахер / стилист / второй фотограф — видно, только если вы в неё добавлены</span>' +
      '<span><i style="border-color:var(--cat-class)"></i>Мастер-классы</span>';
  return '<div class="cal">' + head + gutter + cols + '</div>' +
    '<div class="legend">' + legend + '</div>';
}

/* ---------- сводка по приезду/отъезду ---------- */

var MONTHS_RU_ = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function humanDT_(d, t){
  var m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec((d||'').trim());
  if (!m) return '';
  var day = parseInt(m[1],10), month = parseInt(m[2],10);
  var out = day + ' ' + (MONTHS_RU_[month-1] || '');
  if ((t||'').trim()) out += ', ' + t.trim();
  return out.trim();
}

function travelSortKey_(p){
  var m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec((p.arrival_date||'').trim());
  if (!m) return '9'; // без даты — в конец списка
  var tm = /^(\d{1,2}):(\d{2})$/.exec((p.arrival_time||'').trim());
  var pad = function(v){ v = String(v); return v.length===1 ? '0'+v : v; };
  return m[3] + pad(m[2]) + pad(m[1]) + (tm ? pad(tm[1]) + pad(tm[2]) : '0000');
}

function buildTravelSummary(){
  var travelers = STATE.participants.filter(function(p){ return p.travel; });
  if (!travelers.length) return '';
  travelers = travelers.slice().sort(function(a,b){
    var ka = travelSortKey_(a), kb = travelSortKey_(b);
    return ka < kb ? -1 : ka > kb ? 1 : a.name.localeCompare(b.name, 'ru');
  });
  var rows = travelers.map(function(p){
    var arr = humanDT_(p.arrival_date, p.arrival_time);
    var dep = humanDT_(p.departure_date, p.departure_time);
    var pSrc = photoSrc(p.photo_id);
    return '<tr data-p="' + p.id + '">' +
      '<td class="ts-model"><div class="ts-av">' + (pSrc ? '<img src="'+esc(pSrc)+'">' : '<div class="initial">'+esc(p.name[0])+'</div>') + '</div><span>' + esc(p.name) + '</span></td>' +
      '<td>' + (arr ? esc(arr) : '<span class="ts-empty">—</span>') +
        (p.arrival_ticket_id ? ' <a href="' + esc(photoSrc(p.arrival_ticket_id)) + '" target="_blank" rel="noopener" class="ts-ticket">билет↗</a>' : '') + '</td>' +
      '<td>' + (p.moscow_address ? esc(p.moscow_address) : '<span class="ts-empty">—</span>') + '</td>' +
      '<td>' + (p.met_by ? esc(p.met_by) : '<span class="ts-empty">—</span>') + '</td>' +
      '<td>' + (dep ? esc(dep) : '<span class="ts-empty">—</span>') +
        (p.departure_ticket_id ? ' <a href="' + esc(photoSrc(p.departure_ticket_id)) + '" target="_blank" rel="noopener" class="ts-ticket">билет↗</a>' : '') + '</td>' +
    '</tr>';
  }).join('');
  return '<div class="travel-summary">' +
    '<h2>Приезды и отъезды <span class="ts-count">' + travelers.length + '</span></h2>' +
    '<div class="ts-scroll"><table class="ts-table">' +
      '<thead><tr><th>Модель</th><th>Приезд</th><th>Где живёт</th><th>Кто встречает</th><th>Отъезд</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table></div>' +
  '</div>';
}

        '<button class="btn" id="addClient">+ Добавить клиента</button>' +
      '</div>' +
      '<div class="cal-wrap">' +
        '<div class="filterbar">' +

var HOVER_SHOW_T = null, HOVER_HIDE_T = null;
function scheduleHoverPop(pid, anchorEl){
  clearTimeout(HOVER_HIDE_T);
  clearTimeout(HOVER_SHOW_T);
  HOVER_SHOW_T = setTimeout(function(){ showHoverPop(pid, anchorEl); }, 250);
}
function scheduleHideHoverPop(){
  clearTimeout(HOVER_SHOW_T);
  HOVER_HIDE_T = setTimeout(hideHoverPop, 250);
}
function showHoverPop(pid, anchorEl){
  var p = byId(STATE.participants, pid);
  if (!p) return;
  var root = document.getElementById('hoverPopRoot');
  var rect = anchorEl.getBoundingClientRect();
  var top = Math.min(rect.top, window.innerHeight - 260);
  var left = rect.right + 8;
  if (left + 220 > window.innerWidth) left = rect.left - 228;
  root.innerHTML = '<div class="hoverpop" style="top:' + Math.max(8, top) + 'px;left:' + Math.max(8, left) + 'px">' +
    '<div class="hp-name">' + esc(p.name) + '</div>' +
    '<div class="hp-chk"><input type="checkbox" id="hpTravel" ' + (p.travel?'checked':'') + '> <label style="margin:0">Приезжая</label></div>' +
    '<div id="hpTravelFields" style="display:' + (p.travel?'block':'none') + '">' +
      '<label>Где живёт / разместят</label>' +
      '<input type="text" id="hpAddress" value="' + esc(p.moscow_address) + '">' +
      '<label>Кто встречает</label>' +
      '<input type="text" id="hpMetBy" value="' + esc(p.met_by) + '">' +
    '</div>' +
    '<label>Статус</label>' +
    '<select id="hpStatus">' +
      '<option' + (p.status==='обязательно'?' selected':'') + '>обязательно</option>' +
      '<option' + (p.status==='опционально'?' selected':'') + '>опционально</option>' +
    '</select>' +
    '<button class="btn primary hp-save" id="hpSave">Сохранить</button>' +
  '</div>';
  var pop = root.firstChild;
  pop.addEventListener('mouseenter', function(){ clearTimeout(HOVER_HIDE_T); });
  pop.addEventListener('mouseleave', scheduleHideHoverPop);
  document.getElementById('hpTravel').onchange = function(){
    document.getElementById('hpTravelFields').style.display = this.checked ? 'block' : 'none';
  };
  document.getElementById('hpSave').onclick = function(){
    var travel = document.getElementById('hpTravel').checked;
    var address = document.getElementById('hpAddress').value;
    var metBy = document.getElementById('hpMetBy').value;
    var status = document.getElementById('hpStatus').value;
    Promise.all([
      call('saveParticipantField', TOKEN, pid, 'travel', travel),
      call('saveParticipantField', TOKEN, pid, 'moscow_address', address),
      call('saveParticipantField', TOKEN, pid, 'met_by', metBy),
      call('saveParticipantField', TOKEN, pid, 'status', status)
    ]).then(function(){
      p.travel = travel; p.moscow_address = address; p.met_by = metBy; p.status = status;
      flashSaved(); hideHoverPop(); renderRoster();
    });
  };
}
function hideHoverPop(){
  document.getElementById('hoverPopRoot').innerHTML = '';
}

function openSlotModal(day, startY, existing){
  var s = existing || { id: null, day: day || STATE.days[0].key, start: startY ? snapTime(startY) : '10:00',
    end: '11:00', category: 'shoot', subtype: STATE.shootSubtypes[0], title: '',
    participant_ids: [], client_id: '', shoot_kind: '', notes: '', participant_times: {} };
  s.participant_times = s.participant_times || {};

  var root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-bg"><div class="modal"><h3>' + (existing ? 'Слот в календаре' : 'Новый слот') + '</h3>' +
    '<div>' + ['shoot','class','client'].map(function(c){
      var lbl = c === 'shoot' ? 'Съёмка' : c === 'class' ? 'Класс' : 'Клиент';
      return '<span class="pill' + (s.category===c?' on':'') + '" data-cat="' + c + '">' + lbl + '</span>';
    }).join('') + '</div>' +
    '<label>День</label><select id="mDay">' + STATE.days.map(function(d){
      return '<option value="'+d.key+'"'+(s.day===d.key?' selected':'')+'>'+esc(d.label)+'</option>';
    }).join('') + '</select>' +
    '<div class="row"><div><label>Начало</label><input id="mStart" type="time" value="' + s.start + '"></div>' +
      '<div><label>Конец</label><input id="mEnd" type="time" value="' + s.end + '"></div></div>' +
    '<div id="mFields"></div>' +
    '<label>Заметка</label><textarea id="mNotes" rows="2">' + esc(s.notes) + '</textarea>' +
    '<div class="actions">' +
      (existing ? '<span class="mini" id="mDelete" style="color:var(--ink-3);cursor:pointer;font-size:11px;text-transform:uppercase">Удалить</span>' : '<span></span>') +
      '<span><button class="btn" id="mCancel">Отмена</button> <button class="btn primary" id="mSave">Сохранить</button></span>' +
    '</div>' +
  '</div></div>';

  function renderFields(){
    var f = document.getElementById('mFields');
    if (s.category === 'shoot') {
      f.innerHTML =
        '<label>Кто снимает / готовит</label><select id="mSubtype">' + STATE.shootSubtypes.map(function(x){
          return '<option' + (s.subtype===x?' selected':'') + '>' + esc(x) + '</option>';
        }).join('') + '</select>' +
        '<label>Имя специалиста (необязательно, будет видно в календаре)</label>' +
        '<input id="mTitle" type="text" placeholder="например, имя визажиста" value="' + esc(s.title) + '">' +
        '<label>Вид съёмки (если фотограф)</label><select id="mShootKind"><option value="">—</option>' + STATE.shootKinds.map(function(x){
          return '<option' + (s.shoot_kind===x?' selected':'') + '>' + esc(x) + '</option>';
        }).join('') + '</select>' +
        '<label>Модели (можно выбрать несколько — и указать точное время каждой ниже)</label>' +
        '<div class="multi">' + participantPicker(s.participant_ids, false) + '</div>' +
        participantTimesHtml();
    } else if (s.category === 'class') {
      f.innerHTML =
        '<label>Тип класса</label><select id="mSubtype">' + STATE.classTypes.map(function(x){
          return '<option' + (s.subtype===x?' selected':'') + '>' + esc(x) + '</option>';
        }).join('') + '</select>' +
        '<label>Участницы (и время каждой ниже)</label><div class="multi">' + participantPicker(s.participant_ids, false) + '</div>' +
        participantTimesHtml();
    } else {
      f.innerHTML =
        '<label>Клиент</label><select id="mClient">' + STATE.clients.map(function(c){
          return '<option value="'+c.id+'"' + (s.client_id===c.id?' selected':'') + '>' + esc(c.name) + '</option>';
        }).join('') + '</select>' +
        '<label>Модели у клиента (и время каждой ниже)</label><div class="multi">' + participantPicker(s.participant_ids, false) + '</div>' +
        participantTimesHtml();
    }
    bindPicker();
  }

  function participantPicker(selected, single){
    return STATE.participants.map(function(p){
      var on = selected.indexOf(p.id) >= 0;
      return '<span class="pill' + (on?' on':'') + '" data-pp="' + p.id + '" data-single="' + (single?'1':'0') + '">' + esc(p.name) + '</span>';
    }).join('');
  }
  // время каждой конкретной модели внутри общего блока — С и ДО (например,
  // блок Льва весь день 10:00–18:00, а конкретная модель снимается у него
  // только 11:00–11:30) — чтобы на календаре было видно пунктиром, когда
  // именно её час. Работает для съёмки, класса и клиента — везде, где может
  // быть занята модель.
  function participantTimesHtml(){
    if (!s.participant_ids.length) return '';
    // по хронологии — у кого время раньше, та выше в списке; без времени — в конец
    var ids = s.participant_ids.slice().sort(function(a, b){
      var ta = normPT_(s.participant_times[a]), tb = normPT_(s.participant_times[b]);
      var ka = ta ? ta.start : '99:99', kb = tb ? tb.start : '99:99';
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
    return '<div class="ptimes">' + ids.map(function(id){
      var p = byId(STATE.participants, id);
      var pt = normPT_(s.participant_times[id]) || { start: '', end: '' };
      return '<div class="ptime-row"><span>' + esc(p ? p.name : id) + '</span>' +
        '<div class="ptime-range">' +
          '<input type="time" data-ptime-start="' + id + '" value="' + esc(pt.start) + '">' +
          '<span class="ptime-sep">–</span>' +
          '<input type="time" data-ptime-end="' + id + '" value="' + esc(pt.end) + '">' +
        '</div></div>';
    }).join('') + '</div>';
  }
  function syncPTimes(){
    s.participant_ids.forEach(function(id){
      var startEl = root.querySelector('[data-ptime-start="' + id + '"]');
      var endEl = root.querySelector('[data-ptime-end="' + id + '"]');
      var start = startEl ? startEl.value : '', end = endEl ? endEl.value : '';
      if (start) s.participant_times[id] = { start: start, end: end };
      else delete s.participant_times[id];
    });
  }
  function bindPicker(){
    Array.prototype.forEach.call(root.querySelectorAll('[data-pp]'), function(el){
      el.onclick = function(){
        syncPTimes();
        var id = el.getAttribute('data-pp'), single = el.getAttribute('data-single') === '1';
        if (single) { s.participant_ids = el.classList.contains('on') ? [] : [id]; }
        else {
          var i = s.participant_ids.indexOf(id);
          if (i >= 0) { s.participant_ids.splice(i,1); delete s.participant_times[id]; }
          else s.participant_ids.push(id);
        }
        renderFields();
      };
    });
  }

  renderFields();

  Array.prototype.forEach.call(root.querySelectorAll('[data-cat]'), function(el){
    el.onclick = function(){
      syncPTimes();
      s.category = el.getAttribute('data-cat');
      s.subtype = s.category === 'shoot' ? STATE.shootSubtypes[0] : s.category === 'class' ? STATE.classTypes[0] : '';
      Array.prototype.forEach.call(root.querySelectorAll('[data-cat]'), function(x){ x.classList.toggle('on', x===el); });
      renderFields();
    };
  });

  document.getElementById('mCancel').onclick = function(){ root.innerHTML = ''; };
  root.querySelector('.modal-bg').addEventListener('click', function(ev){ if (ev.target === this) root.innerHTML = ''; });

  if (existing) document.getElementById('mDelete').onclick = function(){
    if (!confirm('Удалить слот?')) return;
    call('deleteSlot', TOKEN, s.id).then(function(){ root.innerHTML = ''; toast('Удалено'); load(); });
  };

  document.getElementById('mSave').onclick = function(){
    syncPTimes();
    s.day = document.getElementById('mDay').value;
    s.start = document.getElementById('mStart').value;
    s.end = document.getElementById('mEnd').value;
    s.notes = document.getElementById('mNotes').value;
    var subEl = document.getElementById('mSubtype'); if (subEl) s.subtype = subEl.value;
    var titleEl = document.getElementById('mTitle'); if (titleEl) s.title = titleEl.value;
    var kindEl = document.getElementById('mShootKind'); if (kindEl) s.shoot_kind = kindEl.value;
    var cliEl = document.getElementById('mClient'); if (cliEl) s.client_id = cliEl.value;

    // Лев на день бывает только один — если это слот с его подтипом на день,
    // где такой слот уже есть (при создании нового, или при переключении
    // подтипа на Льва у другого слота), не плодим второй слот, а сливаем
    // выбранных моделей и их время в уже существующее окно Льва: так у него
    // остаётся одно окно на день, и все, кто в нём снимается, видны пунктиром
    // на общей шкале, а не отдельными узкими блоками рядом.
    if (s.category === 'shoot' && s.subtype === STATE.shootSubtypes[0]) {
      var already = STATE.slots.find(function(x){
        return x.id !== s.id && x.day === s.day && x.category === 'shoot' && x.subtype === STATE.shootSubtypes[0];
      });
      if (already) {
        var mergedIds = already.participant_ids.slice();
        (s.participant_ids || []).forEach(function(pid){ if (mergedIds.indexOf(pid) < 0) mergedIds.push(pid); });
        var mergedTimes = {};
        Object.keys(already.participant_times || {}).forEach(function(k){ mergedTimes[k] = already.participant_times[k]; });
        Object.keys(s.participant_times || {}).forEach(function(k){ mergedTimes[k] = s.participant_times[k]; });
        s.id = already.id;
        s.start = already.start; s.end = already.end;
        s.title = already.title; s.notes = already.notes || s.notes;
        s.participant_ids = mergedIds;
        s.participant_times = mergedTimes;
      }
    }

    call('upsertSlot', TOKEN, s).then(function(){ root.innerHTML = ''; toast('Сохранено'); load(); });
  };
}

/* ---------- делегирование кликов по календарю ---------- */

document.addEventListener('click', function(ev){
  var slotEl = ev.target.closest('.slot');
  if (slotEl) {
    if (STATE.role !== 'agent') return;
    var s = byId(STATE.slots, slotEl.getAttribute('data-slot'));
    if (s) openSlotModal(null, null, s);
    return;
  }
  var col = ev.target.closest('.daycol[data-day]');
  if (col) {
    var rect = col.getBoundingClientRect();
    var y = ev.clientY - rect.top;
    openSlotModal(col.getAttribute('data-day'), y, null);
  }
});

// Вставка лого клиента по Ctrl+V — работает, пока открыта (раскрыта) карточка
// клиента: копируешь картинку откуда угодно и просто жмёшь Ctrl+V на странице.
document.addEventListener('paste', function(ev){
  var openRow = document.querySelector('#clientRoster .roster-row.open');
  if (!openRow) return;
  var items = (ev.clipboardData || window.clipboardData || {}).items;
  if (!items) return;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== 0) continue;
    var file = items[i].getAsFile();
    if (!file) continue;
    ev.preventDefault();
    var id = openRow.getAttribute('data-c');
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = reader.result;
      var base64 = String(dataUrl).split(',')[1] || '';
      var mime = file.type || 'image/png';
      call('uploadClientLogo', TOKEN, id, base64, mime).then(function(res){
        var c = byId(STATE.clients, id);
        if (c) c.logo_id = res.id;
        STATE.images[res.id] = dataUrl;
        flashSaved();
        toast('Лого вставлено');
        renderClientRoster();
      });
    };
    reader.readAsDataURL(file);
    break;
  }
});

load();
</script>
</body></html>
